name: 'iOS build (self-contained: IPA + DEB)'
true:
  workflow_dispatch: null
  push: null
jobs:
  build:
    name: اختبارات + بناء IPA + DEB
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - name: بصمة الحزمة المطبَّقة (تحقق فوري من السجل)
      run: "if [ -f PAYLOAD-VERSION.txt ]; then\n  echo \"══════ بصمة الحزمة ══════\"\n  cat PAYLOAD-VERSION.txt\n  echo \"═════════════════════════\"\nelse\n  echo \"⚠️⚠️ لا يوجد PAYLOAD-VERSION.txt في المستودع ⇒ الحزمة قديمة (قبل إصلاح count) ⚠️⚠️\"\n  echo \"    ارفع fieldwatch-payload.zip الجديدة إلى جذر هذا المستودع ثم شغّل من جديد.\"\nfi\necho \"— الـcommit الذي يُبنى الآن (إن كان قديمًا فالحزمة قديمة) —\"\ngit log -1 --format='%h %ci %s' 2>/dev/null || echo \"(لا .git)\"\nif [ -f FieldwatchApp/Sources/FieldwatchStore.swift ]; then\n  echo \"— السطور 114-118 من SignatureCandidates.swift (يجب أن ترى: usable.filter { … }.count) —\"\n  sed -n '114,118p' FieldwatchCore/Sources/FieldwatchCore/SignatureCandidates.swift 2>/dev/null || echo \"(الملف غير موجود)\"\n  echo \"— بصمة إصلاحات طبقة التطبيق —\"\n  grep -n \"hits: \\$0.hitCount\" FieldwatchApp/Sources/FieldwatchStore.swift 2>/dev/null || echo \"⚠️ FieldwatchStore.swift قديم (لا يزال فيه hitCount: الوسم الخاطئ)\"\n  grep -n \"struct BleRow\" FieldwatchApp/Sources/BleScanner.swift 2>/dev/null || echo \"⚠️ BleScanner.swift قديم (لا يزال يعرّف Sighting محليًا)\"\n  grep -n \"extension FieldwatchCore.Sighting: Identifiable\" FieldwatchApp/Sources/FieldwatchStore.swift 2>/dev/null || echo \"⚠️ ملحق Identifiable غير موجود\"\nelse\n  echo \"ℹ️ المصادر لم تُفكّ بعد (الحزمة مرفوعة كملف zip) — الفحص الكامل يجري في خطوة PREFLIGHT بعد تجهيز المستودع.\"\nfi\n"
    - name: اختيار أحدث Xcode متاح (Swift 6+)
      run: "for x in /Applications/Xcode_18*.app /Applications/Xcode_17*.app /Applications/Xcode_16*.app /Applications/Xcode.app; do\n  if [ -d \"$x\" ]; then sudo xcode-select -s \"$x\" 2>/dev/null && echo \"✓ Xcode: $x\" && break; fi\ndone\necho \"── الإصدارات ──\"\nxcodebuild -version 2>/dev/null || echo \"(xcodebuild غير متاح)\"\nswift --version 2>/dev/null || echo \"(swift غير متاح)\"\n"
    - name: تجهيز المستودع — فكّ أي حزمة مرفوعة + تشخيص واضح
      run: "# ── تجهيز المستودع: يفكّ أحدث حزمة مرفوعة فقط، ويُسطّح المتداخلة، ويتوقف برسالة واضحة ──\nset -e\necho \"┌─ تشخيص المستودع ────────────────────────────\"\necho \"│ repo:   ${GITHUB_REPOSITORY:-محلي}\"\necho \"│ branch: ${GITHUB_REF_NAME:-محلي}\"\necho \"│ pwd:    $(pwd)\"\necho \"└─────────────────────────────────────────────\"\nls -la\n\nshopt -s nullglob\nzips=( *.zip )\nif [ ${#zips[@]} -gt 0 ]; then\n  # ★ مهم: إن كان في الجذر أكثر من حزمة (قديمة + جديدة) فالترتيب الأبجدي قد يعيد\n  #   كتابة الملفات بحزمة أقدم ⇒ نتّبع الأحدث بالمُعدَّل الزمني فقط، ونحذف البقية.\n  newest=\"\"\n  for z in \"${zips[@]}\"; do\n    if [ -z \"$newest\" ] || [ \"$z\" -nt \"$newest\" ]; then newest=\"$z\"; fi\n  done\n  if [ ${#zips[@]} -gt 1 ]; then\n    echo \"⚠️ في الجذر ${#zips[@]} حزم — سأستعمل الأحدث فقط: ${newest}\"\n    printf '   %s\\n' \"${zips[@]}\"\n  fi\n  echo \"\U0001F4E6 أفكّ: ${newest}  ($(du -h \"${newest}\" | cut -f1))\"\n  echo \"   عدد العناصر داخل الحزمة: $(unzip -l \"${newest}\" | tail -1 | awk '{print $2}')\"\n  echo \"   ملفات scripts/ داخل الحزمة:\"; unzip -l \"${newest}\" | grep 'scripts/' || true\n  rm -rf _pkg\n  unzip -o -q \"${newest}\" -d _pkg\n  # حزمة متداخلة (مثل payload/FieldwatchCore/...): نجد جذر المشروع ونُسطّحه\n  if [ ! -d FieldwatchCore ]; then\n    inner=\"$(find _pkg -maxdepth 4 -type d -name FieldwatchCore | head -1)\"\n    if [ -n \"$inner\" ]; then\n      root=\"$(dirname \"$inner\")\"\n      echo \"↪ الحزمة متداخلة تحت: ${root#_pkg/} — تُسطَّح إلى الجذر\"\n      cp -a \"$root\"/. .\n    else\n      cp -a _pkg/. .\n    fi\n  else\n    cp -a _pkg/. .\n  fi\n  rm -rf _pkg\n  rm -f \"${zips[@]}\"\n  echo \"── بعد الفكّ: محتوى scripts/ ──\"\n  ls -la scripts/ 2>/dev/null || echo \"(لا مجلد scripts)\"\nelse\n  echo \"لا يوجد أي ملف .zip في جذر المستودع\"\nfi\n\nif [ ! -d FieldwatchCore ] || [ ! -f FieldwatchCore/Package.swift ]; then\n  echo \"::error title=الحزمة غير موجودة::لم أجد مجلد FieldwatchCore في جذر هذا المستودع.\"\n  echo \" الحل: ارفع الملف fieldwatch-payload.zip إلى جذر هذا المستودع ثم أعد التشغيل.\"\n  exit 1\nfi\necho \"✓ النواة جاهزة: FieldwatchCore/Package.swift\"\n"
    - name: فحص الحزمة قبل البناء (PREFLIGHT)
      run: "if [ ! -f scripts/preflight.sh ]; then\n  echo \"::error::scripts/preflight.sh غير موجود بعد فكّ الحزمة — الحزمة المرفوعة ناقصة أو قديمة جدًا.\"\n  exit 1\nfi\nbash scripts/preflight.sh\n"
    - name: الإصدارات والتحقق من الملفات الضرورية
      run: "xcodebuild -version\nswift --version\necho \"── تحقق ──\"\nfor p in project.yml FieldwatchCore/Package.swift FieldwatchApp/Sources/FieldwatchApp.swift; do\n  if [ -e \"$p\" ]; then echo \"✓ $p\"; else echo \"✗ ناقص: $p\"; fi\ndone\nls -la\n"
    - name: اختبارات النواة (111 اختبارًا)
      continue-on-error: false
      run: 'set -o pipefail

        swift test --package-path FieldwatchCore 2>&1 | tee /tmp/fw-tests.log

        '
    - name: تثبيت الأدوات
      run: 'brew install xcodegen

        brew install ldid || true

        brew install dpkg || true

        command -v dpkg-deb && dpkg-deb --version | head -1 || echo "لا dpkg-deb: ستُبنى الـ IPA فقط"

        '
    - name: توليد مشروع Xcode
      run: xcodegen generate
    - name: بناء التطبيق (unsigned)
      run: "xcodebuild \\\n  -project Fieldwatch.xcodeproj \\\n  -scheme Fieldwatch \\\n  -configuration Release \\\n  -sdk iphoneos \\\n  -destination 'generic/platform=iOS' \\\n  -derivedDataPath build \\\n  CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=\"\" \\\n  build\n"
    - name: 'تجهيز out/ — نسختان: عادية وموقّعة بالصلاحيات'
      run: "# ── تجهيز المستودع: يفكّ أحدث حزمة مرفوعة فقط، ويُسطّح المتداخلة، ويتوقف برسالة واضحة ──\nset -e\necho \"┌─ تشخيص المستودع ────────────────────────────\"\necho \"│ repo:   ${GITHUB_REPOSITORY:-محلي}\"\necho \"│ branch: ${GITHUB_REF_NAME:-محلي}\"\necho \"│ pwd:    $(pwd)\"\necho \"└─────────────────────────────────────────────\"\nls -la\n\nshopt -s nullglob\nzips=( *.zip )\nif [ ${#zips[@]} -gt 0 ]; then\n  # ★ مهم: إن كان في الجذر أكثر من حزمة (قديمة + جديدة) فالترتيب الأبجدي قد يعيد\n  #   كتابة الملفات بحزمة أقدم ⇒ نتّبع الأحدث بالمُعدَّل الزمني فقط، ونحذف البقية.\n  newest=\"\"\n  for z in \"${zips[@]}\"; do\n    if [ -z \"$newest\" ] || [ \"$z\" -nt \"$newest\" ]; then newest=\"$z\"; fi\n  done\n  if [ ${#zips[@]} -gt 1 ]; then\n    echo \"⚠️ في الجذر ${#zips[@]} حزم — سأستعمل الأحدث فقط: ${newest}\"\n    printf '   %s\\n' \"${zips[@]}\"\n  fi\n  echo \"\U0001F4E6 أفكّ: ${newest}  ($(du -h \"${newest}\" | cut -f1))\"\n  echo \"   عدد العناصر داخل الحزمة: $(unzip -l \"${newest}\" | tail -1 | awk '{print $2}')\"\n  echo \"   ملفات scripts/ داخل الحزمة:\"; unzip -l \"${newest}\" | grep 'scripts/' || true\n  rm -rf _pkg\n  unzip -o -q \"${newest}\" -d _pkg\n  # حزمة متداخلة (مثل payload/FieldwatchCore/...): نجد جذر المشروع ونُسطّحه\n  if [ ! -d FieldwatchCore ]; then\n    inner=\"$(find _pkg -maxdepth 4 -type d -name FieldwatchCore | head -1)\"\n    if [ -n \"$inner\" ]; then\n      root=\"$(dirname \"$inner\")\"\n      echo \"↪ الحزمة متداخلة تحت: ${root#_pkg/} — تُسطَّح إلى الجذر\"\n      cp -a \"$root\"/. .\n    else\n      cp -a _pkg/. .\n    fi\n  else\n    cp -a _pkg/. .\n  fi\n  rm -rf _pkg\n  rm -f \"${zips[@]}\"\n  echo \"── بعد الفكّ: محتوى scripts/ ──\"\n  ls -la scripts/ 2>/dev/null || echo \"(لا مجلد scripts)\"\nelse\n  echo \"لا يوجد أي ملف .zip في جذر المستودع\"\nfi\n\nif [ ! -d FieldwatchCore ] || [ ! -f FieldwatchCore/Package.swift ]; then\n  echo \"::error title=الحزمة غير موجودة::لم أجد مجلد FieldwatchCore في جذر هذا المستودع.\"\n  echo \" الحل: ارفع الملف fieldwatch-payload.zip إلى جذر هذا المستودع ثم أعد التشغيل.\"\n  exit 1\nfi\necho \"✓ النواة جاهزة: FieldwatchCore/Package.swift\"\n"
    - name: بناء حزم DEB (rootless + rootful)
      run: "set -e\nif ! command -v dpkg-deb >/dev/null 2>&1; then echo \"dpkg-deb غير متاح — تخطّي DEB\"; exit 0; fi\n\ncat > /tmp/mkdeb.sh <<'SH'\n#!/usr/bin/env bash\n# $1 variant(rootless|rootful) $2 architecture $3 prefix\nset -e\nVARIANT=\"$1\"; ARCH=\"$2\"; PREFIX=\"$3\"\nSRC=\"out/signed-app\"\n[ -d \"$SRC\" ] || SRC=\"out/Fieldwatch.app\"\nOUT=\"out/Fieldwatch-1.1.17-${VARIANT}.deb\"\nWORK=\"$(mktemp -d)\"; ROOT=\"$WORK/pkgroot\"\nmkdir -p \"$ROOT/DEBIAN\" \"$ROOT$PREFIX/Applications\"\ncp -R \"$SRC\" \"$ROOT$PREFIX/Applications/Fieldwatch.app\"\nfind \"$ROOT\" -name '.DS_Store' -delete 2>/dev/null || true\nchmod -R go-w \"$ROOT\"; chmod 755 \"$ROOT$PREFIX/Applications\" \"$ROOT$PREFIX/Applications/Fieldwatch.app\"\nKB=\"$(du -sk \"$ROOT$PREFIX/Applications/Fieldwatch.app\" | cut -f1)\"\ncat > \"$ROOT/DEBIAN/control\" <<CTRL\nPackage: app.fieldwatch.ios\nName: Fieldwatch\nVersion: 1.1.17\nArchitecture: $ARCH\nDescription: Fieldwatch 1.1.17 - passive Wi-Fi / BLE field viewer (iOS port). Private Wi-Fi scanning needs a jailbroken device.\nMaintainer: nou-ops\nSection: Applications\nPriority: optional\nDepends: firmware (>= 15.0)\nInstalled-Size: $KB\nCTRL\ncat > \"$ROOT/DEBIAN/postinst\" <<'POST'\n#!/bin/sh\nU=\"$(command -v uicache 2>/dev/null || true)\"\n[ -n \"$U\" ] || U=\"/var/jb/usr/bin/uicache\"\n[ -x \"$U\" ] && \"$U\" -a 2>/dev/null || true\necho \"Fieldwatch installed. Open it and tap: Wi-Fi diagnostics (probe)\"\nexit 0\nPOST\ncat > \"$ROOT/DEBIAN/postrm\" <<'POST2'\n#!/bin/sh\nU=\"$(command -v uicache 2>/dev/null || true)\"\n[ -n \"$U\" ] || U=\"/var/jb/usr/bin/uicache\"\n[ -x \"$U\" ] && \"$U\" -a 2>/dev/null || true\nexit 0\nPOST2\nchmod 755 \"$ROOT/DEBIAN/postinst\" \"$ROOT/DEBIAN/postrm\"\nrm -f \"$OUT\"\ndpkg-deb --root-owner-group -Zxz --build \"$ROOT\" \"$OUT\" >/dev/null 2>&1 \\\n  || dpkg-deb --root-owner-group --build \"$ROOT\" \"$OUT\" >/dev/null 2>&1 \\\n  || dpkg-deb --build \"$ROOT\" \"$OUT\" >/dev/null\necho \"✓ $OUT ($ARCH · ${PREFIX:-/})\"\nSH\nbash /tmp/mkdeb.sh rootless iphoneos-arm64 /var/jb\nbash /tmp/mkdeb.sh rootful  iphoneos-arm  \"\"\nls -lh out/*.deb\n"
    - name: ملخص الناتج
      if: always()
      run: "{\n  echo \"## الناتج\"\n  ls -lh out/*.ipa out/*.deb 2>/dev/null || ls -lh out/ 2>/dev/null || echo \"لا ناتج\"\n  echo\n  echo \"| الملف | لمن |\"\n  echo \"|---|---|\"\n  echo \"| Fieldwatch-1.1.17-rootless.deb | jailbreak حديث (Dopamine/palera1n rootless) — الأفضل |\"\n  echo \"| Fieldwatch-1.1.17-rootful.deb | jailbreak قديم (checkra1n) |\"\n  echo \"| Fieldwatch-trollstore.ipa | TrollStore/AppSync — نقرة واحدة |\"\n  echo \"| Fieldwatch-unsigned.ipa | تثبيت عادي بلا صلاحيات |\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: ارفع كل المخرجات
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Fieldwatch-build
        path: 'out/*.ipa

          out/*.deb

          /tmp/fw-tests.log

          '
        if-no-files-found: warn
    - name: سياق الفشل (إن فشل شيء)
      if: failure()
      run: 'echo "## فشل البناء" >> "$GITHUB_STEP_SUMMARY"

        echo ''أرسل آخر 60 سطرًا من هذا السجل.'' >> "$GITHUB_STEP_SUMMARY"

        tail -60 /tmp/fw-build.log 2>/dev/null || true

        '
