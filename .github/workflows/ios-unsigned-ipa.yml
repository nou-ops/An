name: Fieldwatch iOS
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: تجهيز المصادر (فكّ الحزمة إن وُجدت، وإلا استعمل الملفات الموجودة)
        run: |
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -gt 0 ]; then
            newest=""
            for z in "${zips[@]}"; do
              if [ -z "$newest" ] || [ "$z" -nt "$newest" ]; then newest="$z"; fi
            done
            if [ ${#zips[@]} -gt 1 ]; then
              echo "⚠️ ${#zips[@]} حزم في الجذر — سأستعمل الأحدث فقط: $newest"
              printf '   %s\n' "${zips[@]}"
            fi
            echo "📦 أفكّ: $newest ($(du -h "$newest" | cut -f1)) · عناصر: $(unzip -l "$newest" | tail -1 | awk '{print $2}')"
            unzip -q -o "$newest"
            rm -f "${zips[@]}"
          else
            echo "ℹ️ لا توجد حزمة .zip — أُكمل بالمصادر الموجودة في المستودع مباشرة (مقبول تمامًا)"
          fi
          if [ ! -f project.yml ]; then
            root=$(dirname "$(find . -maxdepth 3 -name project.yml | head -1)")
            if [ -n "$root" ] && [ "$root" != "." ]; then shopt -s dotglob; mv "$root"/* . ; rm -rf "$root"; fi
          fi
          [ -f project.yml ] || { echo "::error::لا project.yml — لا حزمة في الجذر ولا مصادر مستخرجة. ارفع fieldwatch-payload.zip أو محتواه."; ls -la; exit 1; }
          [ -f FieldwatchCore/Package.swift ] || { echo "::error::لا FieldwatchCore/Package.swift"; exit 1; }
          [ -f scripts/preflight.sh ] || { echo "::error::لا scripts/preflight.sh — الشجرة ناقصة"; exit 1; }
          echo "✓ جاهز — الإصدار: $(sed -n 's/^الإصدار:[[:space:]]*//p' PAYLOAD-VERSION.txt 2>/dev/null | head -1)"
          echo "   ملفات النواة: $(find FieldwatchCore/Sources -name '*.swift' | wc -l) · سكربتات: $(ls scripts/*.sh 2>/dev/null | wc -l)"
          echo "   الـcommit: $(git log -1 --format='%h %ci %s' 2>/dev/null || echo '(بلا .git)')"

      - name: أحدث Xcode متاح
        run: |
          for x in /Applications/Xcode_18*.app /Applications/Xcode_17*.app /Applications/Xcode_16*.app; do
            [ -d "$x" ] && sudo xcode-select -s "$x" && break
          done
          xcodebuild -version

      - name: فحص الحزمة قبل البناء
        run: bash scripts/preflight.sh

      - name: أدوات البناء
        run: |
          brew install xcodegen
          brew install dpkg || true
          brew install ldid || true

      - name: اختبارات النواة
        run: swift test --package-path FieldwatchCore

      - name: بناء IPA + DEB
        run: bash scripts/build-all.sh 2>&1 | tee /tmp/fw-build.log

      - uses: actions/upload-artifact@v4
        with:
          name: Fieldwatch-unsigned-ipa
          path: out/Fieldwatch-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Fieldwatch-trollstore-ipa
          path: out/Fieldwatch-trollstore.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Fieldwatch-trollstore-platform-ipa
          path: out/Fieldwatch-trollstore-platform.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Fieldwatch-deb-rootless
          path: out/*-rootless.deb
      - uses: actions/upload-artifact@v4
        with:
          name: Fieldwatch-deb-rootful
          path: out/*-rootful.deb
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/fw-build.log
